name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-api
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the pushed revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # pinned v6
        with:
          persist-credentials: false
      - name: Send source and wait for a healthy deployment
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.SERVER_DEPLOY_KEY }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" || { echo "SERVER_DEPLOY_KEY is missing"; exit 1; }
          ssh_dir="$RUNNER_TEMP/electbazar-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key"
          printf '%s\n' '72.60.219.140 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILhyVR9UK2pg9teYka1hN7uf6JxvdO1TGd0GkTYcyJWU' > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          trap 'rm -f "$ssh_dir/key"' EXIT
          git archive --format=tar.gz --output="$RUNNER_TEMP/source.tar.gz" HEAD
          ssh -T -i "$ssh_dir/key" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            root@72.60.219.140 "deploy api $DEPLOY_SHA" < "$RUNNER_TEMP/source.tar.gz"
